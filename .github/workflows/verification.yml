name: Verification

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verification-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  portable:
    name: CPU replay (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Verify clean-checkout CPU and replay
        run: python -S scripts/verify_checkout.py

  isolated:
    name: Offline runtime, Chromium, and Linux containment
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - name: Install locked tooling
        run: |
          python -m pip install -r requirements-live.lock
          npm ci --ignore-scripts --prefix tooling/typecheck
          npm ci --ignore-scripts --prefix tooling/frontend
          npm ci --ignore-scripts --prefix tooling/browser
          node tooling/browser/node_modules/playwright/cli.js install --with-deps chromium
      - name: Enable sandbox namespaces for the pinned Chromium binary
        run: |
          browsers=("$HOME"/.cache/ms-playwright/chromium_headless_shell-*/chrome-headless-shell-linux64/chrome-headless-shell)
          test "${#browsers[@]}" -eq 1
          test -x "${browsers[0]}"
          cat > "$RUNNER_TEMP/recursa-chromium.apparmor" <<EOF
          abi <abi/4.0>,
          include <tunables/global>
          profile recursa-chromium "${browsers[0]}" flags=(unconfined) {
            userns,
          }
          EOF
          sudo apparmor_parser -r "$RUNNER_TEMP/recursa-chromium.apparmor"
          node --input-type=module -e 'import { chromium } from "./tooling/browser/node_modules/playwright/index.mjs"; const browser = await chromium.launch({ chromiumSandbox: true }); await browser.close();'
      - name: Run offline tests and real browser checks
        run: |
          mkdir -p .cache
          python scripts/verify.py
      - name: Verify pinned container and scripted broker
        run: |
          python scripts/build_rlm_image.py
          image=$(python -c 'import json; from pathlib import Path; print(json.loads(Path(".cache/rlm-runtime-image.json").read_bytes())["image_id"])')
          python scripts/verify_container.py --image "$image" --output .cache/ci-container
          python scripts/verify_mediated_container.py --output .cache/ci-broker
